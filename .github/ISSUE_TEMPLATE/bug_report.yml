name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. On the start screen, choose Clone Website and paste https://example.com
        2. Open the project and ask the AI to "make the header dark"
        3. See error in the chat / terminal...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or screenshots if possible.
    validations:
      required: true

  - type: input
    id: target-url
    attributes:
      label: Target URL
      description: The website URL you were trying to clone (if applicable).
      placeholder: https://example.com

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node -v` to find this.
      placeholder: v24.x.x
    validations:
      required: true

  - type: dropdown
    id: ai-service
    attributes:
      label: AI Service
      description: Which AI service the app was using, if the problem involves the AI.
      options:
        - Not AI-related
        - Google Gemini
        - Claude API
        - Another Anthropic-compatible service

  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser you use the app in.
      placeholder: Chrome 140

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
