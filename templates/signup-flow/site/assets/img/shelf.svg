  <path d="M379 204v8M389 222v8M379 242v8M389 258v8" stroke="#d9f195" stroke-width="2" stroke-linecap="round"/>
  <circle cx="384" cy="180" r="9" fill="#ee8a63"/>
  <circle cx="384" cy="180" r="3.5" fill="#d9f195"/>
  <path d="M346 284h76l-8 48h-60Z" fill="#c5e866"/>
  <rect x="340" y="272" width="88" height="15" rx="7" fill="#a8cf45"/>

  <!-- shelf -->
  <rect x="30" y="332" width="420" height="12" rx="6" fill="#f4f0e4"/>
  <path d="M96 344v30M384 344v30" stroke="#f4f0e4" stroke-width="6" stroke-linecap="round" opacity=".5"/>

  <!-- pollen -->
  <g fill="#d9f195">
    <circle cx="52" cy="120" r="3"/><circle cx="60" cy="52" r="3.5"/><circle cx="34" cy="232" r="2.5"/><circle cx="448" cy="220" r="3"/><circle cx="170" cy="40" r="2.5"/>
