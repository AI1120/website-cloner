<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <style>
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
    .sway.slow { animation-duration: 9.5s; animation-delay: -3s; }
    @keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
  </style>

  <!-- window arch, with the sun outside it -->
  <path d="M86 336V160a154 154 0 0 1 308 0v176Z" fill="#1a4a3a"/>
  <circle cx="424" cy="66" r="24" fill="#d9f195"/>
  <path d="M240 8v328M86 190h308" stroke="#12352a" stroke-width="5"/>

  <!-- snake plant -->
  <g class="sway">
    <path d="M112 262c-8-58-4-108 10-154 12 46 14 96 8 154Z" fill="#3f9d76"/>
    <path d="M130 262c2-48 14-86 30-116 2 40-6 80-14 116Z" fill="#2f7d5f"/>
    <path d="M96 262c-6-36-10-66-16-92 20 20 30 56 32 92Z" fill="#8fd0b0"/>
    <path d="M121 134c-3 40-3 80 0 120" stroke="#8fd0b0" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  </g>
  <path d="M78 270h84l-9 62H87Z" fill="#d9623b"/>
  <rect x="72" y="258" width="96" height="16" rx="7" fill="#b94e2b"/>

  <!-- monstera -->
  <g class="sway slow">
    <path d="M250 240c-4-36-22-60-38-76M250 240c4-40 26-68 46-86M250 240c0-46 0-86 2-124" stroke="#2f7d5f" stroke-width="4.5" stroke-linecap="round"/>
    <g transform="translate(212 164) rotate(-44)">
      <path d="M0 0C-34-8-44-44-26-70-14-86 14-86 26-70 44-44 34-8 0 0Z" fill="#3f9d76"/>
      <path d="M0-6v-62" stroke="#23614b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-33-42l15 6M33-42l-15 6M-30-22l13 4M30-22l-13 4" stroke="#1a4a3a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(296 154) rotate(42)">
      <path d="M0 0C-34-8-44-44-26-70-14-86 14-86 26-70 44-44 34-8 0 0Z" fill="#2f7d5f"/>
      <path d="M0-6v-62" stroke="#1a4a3a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-33-42l15 6M33-42l-15 6M-30-22l13 4M30-22l-13 4" stroke="#1a4a3a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(252 116) scale(1.08)">
      <path d="M0 0C-34-8-44-44-26-70-14-86 14-86 26-70 44-44 34-8 0 0Z" fill="#5db78e"/>
      <path d="M0-6v-62" stroke="#23614b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-33-42l15 6M33-42l-15 6M-30-22l13 4M30-22l-13 4" stroke="#1a4a3a" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <path d="M196 248h108l-12 84h-84Z" fill="#f4f0e4"/>
  <path d="M200 276h100l-2 14h-96Z" fill="#ee8a63"/>
  <rect x="190" y="236" width="120" height="16" rx="7" fill="#d3ccb6"/>

  <!-- cactus -->
